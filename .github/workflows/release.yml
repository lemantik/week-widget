name: Build & Release APK

on:
  push:
    branches: ["**"]   # сборка на любой ветке, публикация — только из main
    paths-ignore:
      - "**.md"         # правки документации не выпускают новую версию
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      VERSION_CODE: ${{ github.run_number }}
      VERSION_NAME: 1.0.${{ github.run_number }}
      IS_MAIN: ${{ github.ref == 'refs/heads/main' }}

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v6

      - name: Decode signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            if [ "$IS_MAIN" = "true" ]; then
              echo "::error::Secret SIGNING_KEYSTORE_BASE64 is not set — refusing to publish an APK signed with a debug key."
              exit 1
            fi
            echo "::warning::No signing secrets — release APK will be signed with the debug key (build check only)."
            exit 0
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
          echo "SIGNING_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Build release APK
        env:
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease \
            -PversionCode="$VERSION_CODE" -PversionName="$VERSION_NAME"
          cp app/build/outputs/apk/release/app-release.apk "week-widget-$VERSION_NAME.apk"

      - uses: actions/upload-artifact@v7
        with:
          name: week-widget-${{ env.VERSION_NAME }}
          path: week-widget-${{ env.VERSION_NAME }}.apk

      - name: Publish GitHub Release
        if: env.IS_MAIN == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION_NAME }}
          name: Неделя ${{ env.VERSION_NAME }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          files: week-widget-${{ env.VERSION_NAME }}.apk

      - name: Remove keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"
